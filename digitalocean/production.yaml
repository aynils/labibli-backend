# Spécification de l'application « api.labibli.com » chez DigitalOcean.
#
# 🔴 CE FICHIER NE FAIT RIEN TOUT SEUL. DigitalOcean ne lit pas le YAML d'un
# dépôt : il ne regarde `.do/app.yaml` qu'à la CRÉATION d'une application, et
# jamais ensuite. Pour l'appliquer : le coller ENTIER dans la console,
# Settings → App Spec → Edit, puis Save.
#
# ⚠️ CE FICHIER EST UNE COPIE CONFORME DE LA SPÉCIFICATION EN LIGNE, et doit le
# rester. Relire avec `doctl --context bibli apps spec get <id>` avant d'y
# toucher, et comparer après.
#
# ⛔ Il a menti pendant quatre ans. Jusqu'au 01/09/2026 il annonçait
# PostgreSQL **12** et une base `db-s-dev-database` à un nœud, là où la
# production tourne depuis longtemps sur un cluster managé en **16**. Il
# portait aussi `routes:`, que DigitalOcean a remplacé par `ingress:`. Le
# coller n'aurait pas été un remplacement à l'identique : ça aurait touché à la
# déclaration de la base de données de production.
#
# 🔑 Un fichier de configuration qui n'est appliqué nulle part et que personne
# ne sait inerte finit par être cru. C'est ce qui a fait écrire « PostgreSQL 12
# en fin de vie » dans la dette technique du projet, pour une base qui était
# déjà en 16.
#
# Les valeurs `EV[...]` sont chiffrées par DigitalOcean et ne sont
# déchiffrables que par eux : elles vivent dans ce fichier depuis toujours,
# c'est la convention de l'hébergeur.
#
# ⏳ À AJOUTER quand la commande `rappels` sera en production, et pas avant —
# sinon la tâche échoue tous les matins à 8 h :
#
# - envs:
#   - key: DISABLE_COLLECTSTATIC
#     scope: BUILD_TIME
#     value: "1"
#   github:
#     branch: main
#     deploy_on_push: true
#     repo: aynils/labibli-backend
#   instance_count: 1
#   instance_size_slug: basic-xxs
#   kind: SCHEDULED
#   name: rappels
#   run_command: python manage.py rappels
#   schedule:
#     cron: "0 8 * * *"
#     time_zone: America/Toronto
#
# ⚠️ « America/Toronto » et non « UTC » : le fuseau suit l'heure avancée, donc
# l'envoi part à 8 h locales toute l'année. Une heure fixe en UTC glisserait
# d'une heure deux fois par an. Facturé seulement pendant l'exécution.

