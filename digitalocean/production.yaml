    scope: BUILD_TIME
    value: "1"
  github:
    branch: main
    deploy_on_push: true
    repo: aynils/labibli-backend
  instance_count: 1
  instance_size_slug: basic-xxs
  kind: PRE_DEPLOY
  name: migrate
  run_command: python manage.py migrate
- envs:
  - key: DISABLE_COLLECTSTATIC
    scope: BUILD_TIME
    value: "1"
  github:
    branch: main
    deploy_on_push: true
